name: Inspect authorized Acer product feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-acer-feed.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Inspect public Acer catalog metadata
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_COOLBLUE_FEED_URL }}
        run: python3 scripts/inspect-acer-feed.py
