name: Notify search engines after publication
on:
  workflow_dispatch:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: search-engine-notification
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main
      - name: Check public URL list
        run: python3 scripts/notify-search-engines.py --check
      - name: Notify Bing and participating IndexNow search engines
        run: python3 scripts/notify-search-engines.py --wait-for-deploy
