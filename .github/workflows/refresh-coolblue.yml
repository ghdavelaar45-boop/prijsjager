name: Refresh Coolblue, Smartphonehoesjes and Acer catalogs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-tradetracker-catalogs.py
      - scripts/update-security-policy.py
      - scripts/test-security.py
      - assets/awin-clickref.js
      - assets/kh-bezoekers.js
      - assets/acties.js
      - data/acties.json
      - scripts/test-acties.cjs
      - scripts/update-shop-catalogs.py
      - scripts/match-shop-products.py
      - scripts/publish-shop-catalogs.py
      - .github/workflows/refresh-coolblue.yml
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: shop-catalogs
  cancel-in-progress: false
jobs:
  refresh:
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify website and feed security
        run: |
          python3 scripts/update-security-policy.py --check
          python3 scripts/test-security.py
          python3 scripts/test-tradetracker-catalogs.py
          python3 scripts/test-shop-catalogs.py
          python3 scripts/test-product-matches.py
          node scripts/test-exact-prices.cjs
          node scripts/test-catalog-shops.cjs
          node scripts/test-acties.cjs
      - name: Refresh Awin and TradeTracker catalogs
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_COOLBLUE_FEED_URL }}
        run: |
          export KOOPHELDER_CATALOG_STAMP="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          python3 scripts/update-tradetracker-catalogs.py --match-file "$RUNNER_TEMP/koophelder-trade-matches.json"
          python3 scripts/update-shop-catalogs.py --tradetracker-match-file "$RUNNER_TEMP/koophelder-trade-matches.json"
      - name: Publish validated catalogs atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-shop-catalogs.py



