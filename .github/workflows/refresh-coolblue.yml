name: Refresh both shop catalogs and prices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-shop-catalogs.py
      - scripts/publish-shop-catalogs.py
      - .github/workflows/refresh-coolblue.yml
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: shop-catalogs
  cancel-in-progress: false
jobs:
  refresh:
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify website and feed security
        run: |
          python3 scripts/update-security-policy.py --check
          python3 scripts/test-security.py
          python3 scripts/test-shop-catalogs.py
      - name: Refresh Smartphonehoesjes and Coolblue catalogs
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_COOLBLUE_FEED_URL }}
        run: python3 scripts/update-shop-catalogs.py
      - name: Publish validated catalogs atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-shop-catalogs.py
